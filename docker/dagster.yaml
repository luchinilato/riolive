# Instância do Dagster (montado em $DAGSTER_HOME/dagster.yaml pelo compose)
storage:
  postgres:
    postgres_url: postgresql://riolive:riolive@db:5432/dagster

# Cadência de 1 min gera muitos runs: retenção curta pra não inchar o banco
retention:
  schedule:
    purge_after_days: 7
  sensor:
    purge_after_days: 7

# Run em container que morre (todo deploy reinicia a stack) não reporta falha:
# fica STARTED para sempre e ocupa um slot da fila. Com dez órfãos, o
# QueuedRunCoordinator (máximo 10) para de lançar qualquer coisa — foi o que
# derrubou a coleta por 6 h em 2026-08-07, sem nada acusar.
run_monitoring:
  enabled: true
  # De quanto em quanto tempo o daemon confere se o processo do run existe.
  poll_interval_seconds: 60
  # Run preso em STARTING (o launcher morreu antes de subir) vira falha.
  start_timeout_seconds: 300
  # Zero retomadas de propósito: coleta de uma hora atrás não tem valor, e
  # retomar em cima de um deploy é como o órfão nasce.
  max_resume_run_attempts: 0

telemetry:
  enabled: false

# Teto de simultaneidade: 5, não os 10 do padrão.
#
# Cada run é um processo que importa o mundo (dagster + riolive + shapely/h3).
# Dez ao mesmo tempo, numa máquina de 6 núcleos, levaram o container do daemon a
# 559% de CPU em 2026-08-08 — e a máquina saturada foi o que fez o code server
# perder o heartbeat, o que fabricou os runs zumbis, o que engordou a fila, que
# ao ser drenada saturava de novo. Ciclo que se alimenta.
#
# O teto não custa vazão no dia normal (coleta leva segundos e a fila fica
# vazia); ele age exatamente quando há atraso acumulado, que é quando saturar
# piora tudo.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 5
