# Override de produção — usar junto com o docker-compose.yml base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (o .env de produção define COMPOSE_FILE, então `docker compose up -d` já resolve)
#
# Princípios: nenhuma porta de serviço exposta pra internet (o Docker fura o UFW
# em portas publicadas — por isso tudo aqui é 127.0.0.1); só o Caddy publica 80/443.
# Dagster UI e Postgres: acesso por túnel SSH (ssh -L 3300:127.0.0.1:3300 ...).

services:
  db:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      RIOLIVE_DATABASE_URL: postgresql+psycopg://riolive:${POSTGRES_PASSWORD}@db:5432/riolive

  # Onde os runs de verdade executam (ver workspace.yaml). Precisa do mesmo
  # ambiente da API: banco, credenciais do .env e o volume `dados`, que é onde
  # mora a credencial do BigQuery usada pelas cargas.
  dagster-codigo:
    restart: unless-stopped
    environment:
      RIOLIVE_DATABASE_URL: postgresql+psycopg://riolive:${POSTGRES_PASSWORD}@db:5432/riolive
      DAGSTER_PG_URL: postgresql://riolive:${POSTGRES_PASSWORD}@db:5432/dagster
    volumes:
      - ./deploy/dagster.prod.yaml:/app/.dagster_home/dagster.yaml:ro
      - ./dados:/app/dados

  dagster-webserver:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3300:3000"
    environment:
      RIOLIVE_DATABASE_URL: postgresql+psycopg://riolive:${POSTGRES_PASSWORD}@db:5432/riolive
      DAGSTER_PG_URL: postgresql://riolive:${POSTGRES_PASSWORD}@db:5432/dagster
    volumes:
      - ./deploy/dagster.prod.yaml:/app/.dagster_home/dagster.yaml:ro
      - ./dados:/app/dados

  dagster-daemon:
    restart: unless-stopped
    environment:
      RIOLIVE_DATABASE_URL: postgresql+psycopg://riolive:${POSTGRES_PASSWORD}@db:5432/riolive
      DAGSTER_PG_URL: postgresql://riolive:${POSTGRES_PASSWORD}@db:5432/dagster
    volumes:
      - ./deploy/dagster.prod.yaml:/app/.dagster_home/dagster.yaml:ro
      - ./dados:/app/dados

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./painel/dist:/srv/painel:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_dados:
  caddy_config:
